name: lé build
on: workflow_call
jobs:
  Build:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Setup environment
        uses: actions/setup-node@v4
      - name: Load & Cache Dependencies
        uses: ./.github/actions/cached-deps
      - name : run Build
        run: npm run build