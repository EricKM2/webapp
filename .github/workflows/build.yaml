
name: Le build

on:
  workflow_call:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load & Cache Dependencies
        uses: ./.github/actions/cached-deps

      - name: Run Build
        run: npm run build
